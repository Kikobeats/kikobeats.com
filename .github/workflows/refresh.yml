name: refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production build
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -m 30 --retry 5 -X POST "$VERCEL_DEPLOY_HOOK"
